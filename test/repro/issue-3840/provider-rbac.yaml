apiVersion: v1
kind: Namespace
metadata:
  name: repro-ns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-sa
  namespace: repro-ns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-sa-role
rules:
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["list", "watch", "get"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    resourceNames: ["wildwest.dev"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-sa-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-sa-role
subjects:
  - kind: ServiceAccount
    name: provider-sa
    namespace: repro-ns
