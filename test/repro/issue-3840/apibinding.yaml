apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: wildwest.dev
spec:
  reference:
    export:
      name: wildwest.dev
      path: "root:provider"
  permissionClaims:
    - group: ""
      resource: events
      verbs: ["list", "watch", "get"]
      selector:
        matchAll: true
      state: Accepted
    - group: tenancy.kcp.io
      resource: workspaces
      # The identityHash is the identity hash of the root tenancy.kcp.io APIExport:
      #   kubectl get apiexport tenancy.kcp.io -o jsonpath='{.status.identityHash}' --context root
      identityHash: TENANCY_IDENTITY_HASH
      verbs: ["get", "list", "watch"]
      selector:
        matchAll: true
      state: Accepted
